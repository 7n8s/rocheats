name: Build website

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the website and package it
        run: |
          set -euo pipefail
          node --check app.js
          zip -qr RoCheatsMonitor-web.zip index.html styles.css app.js assets
          unzip -t RoCheatsMonitor-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RoCheatsMonitor-Web
          path: RoCheatsMonitor-web.zip
          if-no-files-found: error

  release:
    name: Release website (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RoCheatsMonitor-Web
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/RoCheatsMonitor-web.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
